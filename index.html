<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>FSportIN · Türne Fest</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://use.typekit.net/dgw5mps.css">
<style>
/* Linguagem: concepts de UX/UI desportiva — cartões escuros, muito ar, tipografia leve (400/500),
   números grandes e finos, informação secundária pequena e cinzenta. Amarelo só para a nossa equipa e estados. */
:root{color-scheme:dark;
--bg:#0b0b0c;--card:#161618;--card2:#1e1e21;--line:#26262a;--ink:#f4f4f5;--soft:#c4c4c8;--mut:#8a8a90;--dim:#5e5e64;
--y:#ffd21f;--yd:rgba(255,210,31,.12);--r:20px;--rs:14px;--pad:clamp(16px,3vw,40px);--gap:clamp(12px,1.4vw,20px)}
*{box-sizing:border-box;min-width:0}
html,body{margin:0;background:var(--bg);color:var(--ink)}
body{font:400 15px/1.45 degular,Figtree,system-ui,sans-serif;font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased;overflow-x:clip}
b,strong,h1,h2,h3,h4{font-weight:500}
a{color:inherit}
:focus-visible{outline:2px solid var(--y);outline-offset:2px;border-radius:8px}
.wrap{padding-inline:var(--pad)}

/* topo */
.top{padding-top:28px}
.bar1{display:flex;align-items:center;justify-content:space-between;gap:16px}
.bar1 img{height:20px;display:block}
.bar1 .ed{font-size:13px;color:var(--mut)}
.hero{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:20px 40px;margin:40px 0 28px}
.hero h1{font-size:clamp(40px,6vw,72px);line-height:.95;letter-spacing:-.03em;margin:0}
.hero h1 span{display:block;font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--y);margin-bottom:14px;line-height:1}
.stats{display:grid;grid-template-columns:repeat(5,minmax(110px,1fr));gap:10px;flex:1 1 560px;max-width:880px}
.stat{background:var(--card);border-radius:var(--rs);padding:14px 16px}
.stat b{display:block;font-size:clamp(20px,1.8vw,26px);line-height:1.05;letter-spacing:-.02em;white-space:nowrap}
.stat span{font-size:12px;color:var(--mut)}

/* controlo */
.ctrl{position:sticky;top:0;z-index:5;background:linear-gradient(var(--bg) 82%,transparent);padding:14px 0 18px;display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.tabs{display:flex;gap:6px;background:var(--card);padding:5px;border-radius:999px;overflow-x:auto}
.tabs button{flex:none;font:500 14px degular,Figtree,sans-serif;color:var(--mut);background:none;border:0;padding:9px 16px;border-radius:999px;cursor:pointer;min-height:38px}
.tabs button:hover{color:var(--ink)}
.tabs button[aria-selected=true]{background:var(--ink);color:#000}
.search{flex:1 1 220px;display:flex;align-items:center;gap:8px;background:var(--card);border-radius:999px;padding:0 16px;min-height:48px}
.search svg{flex:none;opacity:.5}
.search input{flex:1;background:none;border:0;color:var(--ink);font:400 15px degular,Figtree,sans-serif;outline:none;min-height:44px}
.search input::placeholder{color:var(--dim)}
select{font:400 14px degular,Figtree,sans-serif;color:var(--ink);background:var(--card);border:0;border-radius:999px;padding:0 16px;min-height:48px}

main{padding-bottom:72px}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;margin-bottom:8px}
.chip{flex:none;font:400 13px degular,Figtree,sans-serif;color:var(--soft);background:var(--card);border:0;border-radius:999px;padding:8px 14px;cursor:pointer;min-height:36px}
.chip small{color:var(--dim);margin-left:6px}
.chip[aria-pressed=true]{background:var(--ink);color:#000}.chip[aria-pressed=true] small{color:#555}
.sec{margin-top:28px}
.sec h2{display:flex;align-items:baseline;gap:12px;font-size:22px;letter-spacing:-.01em;margin:0 0 14px}
.sec h2 small{font:400 13px degular,Figtree,sans-serif;color:var(--mut)}
.grid{display:grid;grid-template-columns:minmax(0,1fr);gap:var(--gap)}
@media(min-width:600px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(min-width:1024px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}}

/* cartão de jogo */
.mc{background:var(--card);border-radius:var(--r);padding:18px 20px 16px;display:flex;flex-direction:column;gap:14px}
.mc-h{display:flex;align-items:center;justify-content:space-between;gap:10px}
.when{display:flex;align-items:baseline;gap:8px}
.when .t{font-size:24px;line-height:1;letter-spacing:-.02em}
.when .d{font-size:12px;color:var(--mut)}
.cat{font-size:12px;font-weight:500;color:var(--ink);border:1px solid var(--line);border-radius:999px;padding:4px 10px;white-space:nowrap}
.teams{display:flex;flex-direction:column;gap:8px}
.tm{display:grid;grid-template-columns:28px minmax(0,1fr) auto;align-items:center;gap:10px}
.tm .ico{width:28px;height:28px;border-radius:50%;background:var(--card2);display:grid;place-items:center}
.tm .ico img{width:18px;height:auto}
.tm .ico i{width:6px;height:6px;border-radius:50%;background:var(--dim)}
.tm .nm{font-size:15px;color:var(--soft);line-height:1.25}
.tm .nm small{display:block;color:var(--dim);font-size:12px;margin-top:2px}
.tm.us .nm{color:var(--ink);font-weight:500}
.tm.us .ico{background:var(--yd)}
.tm.w .nm::after{content:"";display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--y);margin-left:8px;vertical-align:middle}
.sc{display:flex;gap:6px}
.sc span{min-width:22px;text-align:center;font-size:16px;color:var(--soft)}
.sc span.win{color:var(--ink);font-weight:500}
.mc-f{margin-top:auto;display:flex;align-items:center;justify-content:space-between;gap:10px;border-top:1px solid var(--line);padding-top:12px}
.meta{font-size:12px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.st{font-size:12px;white-space:nowrap;color:var(--mut);display:inline-flex;align-items:center;gap:6px}
.st::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--dim)}
.st.live{color:var(--y)}.st.live::before{background:var(--y)}
.st.win{color:var(--y)}.st.win::before{background:var(--y)}
.st.loss{color:var(--soft)}.st.loss::before{background:#e5484d}
.st.done::before{background:var(--soft)}
@media(prefers-reduced-motion:no-preference){.st.live::before{animation:p 1.4s ease-in-out infinite}@keyframes p{50%{opacity:.3}}}

/* cartões de grupo e de dupla */
.card{background:var(--card);border-radius:var(--r);padding:20px;display:flex;flex-direction:column;gap:16px}
.card-h{display:flex;align-items:center;gap:10px}
.card-h h3{font-size:18px;margin:0;letter-spacing:-.01em;line-height:1.2}
.card-h .tag{margin-left:auto;font-size:12px;color:var(--mut)}
table{width:100%;border-collapse:collapse;font-size:14px}
th{font-size:11px;font-weight:400;letter-spacing:.06em;text-transform:uppercase;color:var(--dim);text-align:right;padding:0 6px 8px}
td{padding:11px 6px;border-top:1px solid var(--line);text-align:right;color:var(--soft)}
th:nth-child(2),td:nth-child(2){text-align:left}
td:first-child{color:var(--dim);width:22px}
td:nth-child(2){white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:0;width:100%}
tr.us td{color:var(--ink)}tr.us td:nth-child(2){font-weight:500}
tr.us td:first-child{color:var(--y)}
td.pts{color:var(--ink);font-weight:500}
.mini{display:flex;flex-direction:column;gap:8px}.card .mini .mc-f{margin-top:0}
.mini .mc{background:var(--card2);padding:14px 16px 12px;gap:10px;border-radius:var(--rs)}
.mini .when .t{font-size:18px}
.lbl{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--dim);margin:2px 0 -6px}
.path{list-style:none;margin:0;padding:0;font-size:13px;color:var(--soft)}
.path li{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-top:1px solid var(--line)}
.path li span:last-child{color:var(--mut);text-align:right}
.path li b{color:var(--ink)}
.form{display:flex;gap:5px}
.form i{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font:500 10px degular,Figtree,sans-serif;font-style:normal;border:1px solid var(--line);color:var(--dim)}
.form i.v{border-color:var(--y);color:var(--y)}.form i.d{border-color:#e5484d;color:#e5484d}
.empty{background:var(--card);border-radius:var(--r);padding:40px;text-align:center;color:var(--mut)}

/* rodapé */
.site{margin-top:24px;border-top:1px solid var(--line);padding-block:48px 56px}
.site-in{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:40px;align-items:end}
.logos{display:flex;align-items:center;gap:28px;margin-bottom:28px}
.logos .a{height:22px}.logos .b{height:46px}
.mote{font-size:clamp(26px,3.6vw,44px);line-height:1.05;letter-spacing:-.025em;margin:0;max-width:20ch}
.info{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:0}
.info div{background:var(--card);border-radius:var(--rs);padding:14px 16px}
.info dt{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--dim)}
.info dd{margin:4px 0 0;font-size:16px;font-weight:500}
.info a{text-decoration:none;border-bottom:1px solid var(--y)}
.foot{grid-column:1/-1;font-size:12px;color:var(--dim);margin:0;max-width:80ch}

@media(min-width:1024px){
 body{font-size:16px}
 .bar1 img{height:24px}.bar1 .ed{font-size:14px}
 .hero h1 span{font-size:14px}
 .stats{grid-template-columns:repeat(4,minmax(0,1fr)) minmax(0,1.5fr)}
 .stat{padding:18px 20px}.stat b{font-size:clamp(22px,2vw,30px)}.stat span{font-size:13px}
 .tabs button{font-size:15px;padding:10px 20px;min-height:42px}
 .search,select{min-height:52px}.search input,select{font-size:16px}
 .sec h2{font-size:26px}.sec h2 small{font-size:14px}
 .mc{padding:24px 26px 20px;gap:18px}
 .when .t{font-size:30px}.when .d{font-size:13px}
 .cat{font-size:13px;padding:5px 12px}
 .tm{grid-template-columns:34px minmax(0,1fr) auto;gap:12px}
 .tm .ico{width:34px;height:34px}.tm .ico img{width:22px}
 .tm .nm{font-size:17px}.tm .nm small{font-size:13px}
 .sc span{font-size:18px;min-width:26px}
 .mc-f{padding-top:14px}.meta,.st{font-size:13px}
 .card{padding:26px;gap:18px}.card-h h3{font-size:21px}.card-h .tag{font-size:13px}
 table{font-size:15px}th{font-size:12px}td{padding:13px 8px}
 .mini .mc{padding:18px 20px 14px}.mini .when .t{font-size:21px}
 .path{font-size:14px}.lbl{font-size:12px}
 .form i{width:26px;height:26px;font-size:11px}
 .info dd{font-size:18px}.foot{font-size:13px}
 .logos .a{height:26px}.logos .b{height:54px}
}
@media(max-width:820px){.stats{grid-template-columns:repeat(3,1fr)}.site-in{grid-template-columns:1fr}}
@media(max-width:520px){.tm .nm{white-space:normal}.tm .nm small{display:block;margin:2px 0 0}.mc-f{flex-wrap:wrap}.meta{white-space:normal}.stats{grid-template-columns:repeat(2,1fr)}.stat:last-child{grid-column:1/-1}.hero{margin:28px 0 20px}.ctrl{position:static}.tabs{width:100%}}
</style>
</head>
<body>
<header class="top wrap">
 <div class="bar1"><img src="assets/fsportin-logo-white.svg" alt="FSportIN Padel"><span class="ed">Winter Edition · 28/11 – 08/12</span></div>
 <div class="hero">

  <select id="cat" aria-label="Categoria"><option value="">Todas as categorias</option></select>
 </div>
 <div id="view"></div>
</main>
<footer class="site wrap">
 <div class="site-in">
  <div>
   <div class="logos"><img class="a" src="assets/fsportin-logo-white.svg" alt="FSportIN Padel"><img class="b" src="assets/turne-logo-white.png" alt="Türne"></div>
   <p class="mote">It's our Türne, our union is our victory</p>
  </div>
  <dl class="info">
   <div><dt>Quando</dt><dd>28/11 – 08/12/2026</dd></div>

 </div>
</footer>

<script>
{
const S=JSON.parse(document.getElementById('schedule').textContent);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const isUs=t=>/fsport/i.test(t||'');
const isPh=t=>/^(.+) \/ \1$/.test(String(t).trim());
/* separa nomes e clube: "A / B - Clube" */
const split=t=>{if(isPh(t))return{n:'Dupla por definir',c:''};const s=String(t).replace(/\s*-\s*FSport?IN$/i,'');const m=s.match(/^(.*?)\s*[-.]\s*([^/]+)$/);return isUs(t)?{n:s.trim(),c:''}:(m&&m[1].includes('/')?{n:m[1].trim(),c:m[2].trim()}:{n:s.trim(),c:''})};
const nm=t=>split(t).n;
const DAYS=['28/11','29/11','30/11','01/12','02/12','03/12','04/12','05/12','06/12','07/12','08/12'];
const WD=['dom','seg','ter','qua','qui','sex','sáb'];
const CATS=['M2','M3','F3','MX3','M4','F4','MX4','M5','F5','MX5','M6','F6','MX6','M7','F7','KIDS 1','KIDS 2','Vet.+45 - M'];
const catRank=c=>{const i=CATS.indexOf(c);return i<0?99:i};
const catLabel=c=>c.replace(/^MX/,'Mx').replace(/^KIDS/,'Kids').replace(/ - M$/,' M');
const dobj=d=>{const[dd,mm]=d.split('/').map(Number);return new Date(2026,mm-1,dd)};
const dlabel=d=>{const o=dobj(d);return WD[o.getDay()]+' '+d};
const sortKey=m=>dobj(m.d).getTime()+(+m.t.slice(0,2))*60+(+m.t.slice(3));
let R={results:{},extra:[],updated:null};let M=[];
function build(){const by=new Map();
 for(const r of S){const[c,n,ph,a,b,court,d,t]=r;by.set(c+'|'+n,{c,n,ph,a,b,court,d,t})}
 for(const r of (R.extra||[])){if(!Array.isArray(r)||r.length<8)continue;const[c,n,ph,a,b,court,d,t]=r.map(String);by.set(c+'|'+n,{c,n,ph,a,b,court,d,t})}
 M=[...by.values()].map(m=>{const k=m.c+'|'+m.n;return{...m,k,res:R.results?.[k]||null,us:isUs(m.a)||isUs(m.b)}});
 M.sort((x,y)=>sortKey(x)-sortKey(y))}
function sets(sc){const p=String(sc||'').match(/\d+\s*[-–]\s*\d+/g)||[];return p.map(s=>s.split(/[-–]/).map(x=>+x.trim()))}
function winner(m){if(!m.res)return 0;if(m.res.w==1||m.res.w==2)return +m.res.w;let a=0,b=0;sets(m.res.sc).forEach(([x,y])=>x>y?a++:y>x&&b++);return /fim/i.test(m.res.st||'')||a+b>=2?(a>b?1:b>a?2:0):0}
const usSide=m=>isUs(m.a)?1:2;
function status(m){const w=winner(m);if(/jog|live|curso/i.test(m.res?.st||'')&&!w)return['live','A jogar'];
 if(w&&m.us)return w===usSide(m)?['win','Vitória']:['loss','Derrota'];if(w)return['done','Terminado'];return['','Por jogar']}
function scoreCells(m,side){return sets(m.res?.sc).map(([x,y])=>{const me=side===1?x:y,op=side===1?y:x;return`<span class="${me>op?'win':''}">${me}</span>`}).join('')}
function teamRow(m,t,side,w){const us=isUs(t),p=split(t);
 return`<div class="tm${us?' us':''}${w===side?' w':''}"><span class="ico">${us?'<img src="assets/lobo-white.svg" alt="">':'<i></i>'}</span><span class="nm">${esc(p.n)}${p.c?`<small>${esc(p.c)}</small>`:''}</span><span class="sc">${scoreCells(m,side)}</span></div>`}
/* cartão de jogo: hora + categoria no topo, nossa dupla primeiro, meta e estado no rodapé */
function card(m,showCat=true){const w=winner(m);const order=(!isUs(m.a)&&isUs(m.b))?[[m.b,2],[m.a,1]]:[[m.a,1],[m.b,2]];const[sc,sl]=status(m);
 return`<article class="mc"><div class="mc-h"><div class="when"><span class="t">${esc(m.t)}</span><span class="d">${esc(dlabel(m.d))}</span></div>${showCat?`<span class="cat">${esc(catLabel(m.c))}</span>`:''}</div>
 <div class="teams">${order.map(([t,s])=>teamRow(m,t,s,w)).join('')}</div>
 <div class="mc-f"><span class="meta">${esc(m.ph)} · Campo ${esc(m.court)} · Jogo ${esc(m.n.replace('#',''))}</span><span class="st ${sc}">${sl}</span></div></article>`}
const st={v:'calendario',q:'',cat:'',day:null};
try{const s=JSON.parse(localStorage.getItem('fsp')||'{}');Object.assign(st,{q:s.q||'',cat:s.cat||''})}catch(e){}
function save(){try{localStorage.setItem('fsp',JSON.stringify({q:st.q,cat:st.cat}))}catch(e){}}
function filt(l){const q=st.q.trim().toLowerCase();return l.filter(m=>(!st.cat||m.c===st.cat)&&(!q||(m.a+' '+m.b).toLowerCase().includes(q)))}
const ours=()=>filt(M.filter(m=>m.us));
function todayStr(){const n=new Date();return String(n.getDate()).padStart(2,'0')+'/'+String(n.getMonth()+1).padStart(2,'0')}
const today0=()=>new Date(new Date().toDateString());
function defaultDay(L){const td=todayStr();if(DAYS.includes(td)&&L.some(m=>m.d===td))return td;const nx=L.find(m=>dobj(m.d)>=today0());return nx?nx.d:(L.length?L[L.length-1].d:'all')}
function vCal(){const L=ours();if(!st.day||(st.day!=='all'&&!L.some(m=>m.d===st.day)))st.day=defaultDay(L);
 const td=todayStr();
 const chips=[...DAYS,'all'].map(d=>{const n=d==='all'?L.length:L.filter(m=>m.d===d).length;if(!n&&d!=='all')return'';const lab=d==='all'?'Ver todos':(d===td?'Hoje':dlabel(d));return`<button class="chip" data-day="${d}" aria-pressed="${st.day===d}">${esc(lab)}<small>${n}</small></button>`}).join('');
 const body=(st.day==='all'?DAYS:[st.day]).map(d=>{const l=L.filter(m=>m.d===d);return l.length?`<section class="sec"><h2>${d===td?'Hoje':esc(dlabel(d))}<small>${d===td?esc(dlabel(d))+' · ':''}${l.length} jogos</small></h2><div class="grid">${l.map(m=>card(m)).join('')}</div></section>`:''}).join('');
 return`<div class="chips">${chips}</div>${body||'<div class="empty">Sem jogos da FSportIN com este filtro.</div>'}`}
function standings(c,g){const gm=M.filter(m=>m.c===c&&m.ph===g&&/^#1\./.test(m.n));const T=new Map();
 const add=t=>{if(!T.has(t))T.set(t,{t,j:0,v:0,d:0,sp:0,sc:0,gp:0,gc:0})};
 for(const m of gm){add(m.a);add(m.b);const w=winner(m);if(!w)continue;const A=T.get(m.a),B=T.get(m.b);A.j++;B.j++;if(w===1){A.v++;B.d++}else{B.v++;A.d++}
  for(const[x,y]of sets(m.res.sc)){A.gp+=x;A.gc+=y;B.gp+=y;B.gc+=x;if(x>y){A.sp++;B.sc++}else if(y>x){B.sp++;A.sc++}}}
 const arr=[...T.values()].sort((x,y)=>y.v-x.v||(y.sp-y.sc)-(x.sp-x.sc)||(y.gp-y.gc)-(x.gp-x.gc));
 return{arr,done:gm.length&&gm.every(m=>winner(m)),games:gm}}
function groupsOfUs(){const s=new Map();for(const m of M)if(m.us&&/^Grupo/.test(m.ph)&&/^#1\./.test(m.n)){const k=m.c+'|'+m.ph;if(!s.has(k))s.set(k,{c:m.c,g:m.ph})}
 return[...s.values()].sort((a,b)=>catRank(a.c)-catRank(b.c)||a.g.localeCompare(b.g,'pt'))}
const sg=n=>(n>0?'+':'')+n;
function table(s){return`<table><thead><tr><th>#</th><th>Dupla</th><th>J</th><th>V</th><th>Sets</th><th>Jogos</th></tr></thead><tbody>${s.arr.map((r,i)=>`<tr class="${isUs(r.t)?'us':''}"><td>${i+1}</td><td>${esc(nm(r.t))}</td><td>${r.j}</td><td class="pts">${r.v}</td><td>${sg(r.sp-r.sc)}</td><td>${sg(r.gp-r.gc)}</td></tr>`).join('')}</tbody></table>`}
function vCats(){let G=groupsOfUs().filter(x=>!st.cat||x.c===st.cat);const q=st.q.trim().toLowerCase();
 if(q)G=G.filter(x=>M.some(m=>m.c===x.c&&m.ph===x.g&&m.us&&(m.a+' '+m.b).toLowerCase().includes(q)));
 if(!G.length)return'<div class="empty">Sem grupos com este filtro.</div>';
 return`<section class="sec"><div class="grid">${G.map(x=>{const s=standings(x.c,x.g);return`<div class="card"><div class="card-h"><span class="cat">${esc(catLabel(x.c))}</span><h3>${esc(x.g)}</h3><span class="tag">${s.done?'Fechado':'Provisório'}</span></div>${table(s)}<div class="lbl">Jogos da FSportIN</div><div class="mini">${s.games.filter(m=>m.us).map(m=>card(m,false)).join('')}</div></div>`}).join('')}</div></section>`}
function pairs(){const P=new Map();for(const m of M)for(const t of[m.a,m.b])if(isUs(t)&&/^#1\./.test(m.n)&&/^Grupo/.test(m.ph)){const k=m.c+'|'+t;if(!P.has(k))P.set(k,{c:m.c,t,g:m.ph})}
 return[...P.values()].sort((a,b)=>catRank(a.c)-catRank(b.c)||nm(a.t).localeCompare(nm(b.t),'pt'))}
function vPairs(){const q=st.q.trim().toLowerCase();const P=pairs().filter(p=>(!st.cat||p.c===st.cat)&&(!q||p.t.toLowerCase().includes(q)));
 if(!P.length)return'<div class="empty">Nenhuma dupla com este filtro.</div>';
 return`<section class="sec"><div class="grid">${P.map(p=>{const s=standings(p.c,p.g);const pos=s.arr.findIndex(r=>r.t===p.t)+1;const me=s.arr[pos-1];
  const gl=p.g.replace('Grupo ','');const later=M.filter(m=>m.c===p.c&&!/^#1\./.test(m.n));
  const named=later.filter(m=>m.a===p.t||m.b===p.t);const re=new RegExp('(\\d)º Grupo '+gl+'$');
  const slots=later.filter(m=>re.test(m.a)||re.test(m.b)).filter(m=>!named.some(n=>n.k===m.k));
  const gms=M.filter(m=>(m.a===p.t||m.b===p.t)).filter(m=>/^#1\./.test(m.n));
  const form=gms.map(m=>{const w=winner(m);const s2=m.a===p.t?1:2;return w?(w===s2?'<i class="v">V</i>':'<i class="d">D</i>'):'<i>·</i>'}).join('');
  const lines=[`<li><span><b>Fase de grupos</b> · ${esc(p.g)}</span><span>${me&&me.j?pos+'.º · '+me.v+'V '+me.d+'D':'por jogar'}</span></li>`];
  named.forEach(m=>{const w=winner(m);const sd=m.a===p.t?1:2;lines.push(`<li><span><b>${esc(m.ph)}</b> · vs ${esc(nm(sd===1?m.b:m.a))}</span><span>${w?(w===sd?'Ganhou':'Perdeu'):esc(dlabel(m.d)+' '+m.t+' · Campo '+m.court)}</span></li>`)});
  if(!named.length&&slots.length){const by={};slots.forEach(m=>{const k=(re.test(m.a)?m.a:m.b).match(/^(\d)/)[1];(by[k]??=[]).push(m)});
   Object.keys(by).sort().forEach(k=>{const m=by[k][0];lines.push(`<li><span>Se ficar <b>${k}.º</b> · ${esc(m.ph)}</span><span>${esc(dlabel(m.d)+' '+m.t+' · Campo '+m.court)}</span></li>`)})}
  if(!named.length&&!slots.length)lines.push('<li><span>Eliminatórias</span><span>quando a organização sortear</span></li>');
  return`<div class="card"><div class="card-h"><span class="cat">${esc(catLabel(p.c))}</span><h3>${esc(nm(p.t))}</h3><span class="tag form">${form}</span></div><div class="mini">${gms.map(m=>card(m,false)).join('')}</div><div class="lbl">Percurso</div><ul class="path">${lines.join('')}</ul></div>`}).join('')}</div></section>`}
function stats(){const L=M.filter(m=>m.us);let v=0,d=0;for(const m of L){const w=winner(m);if(!w)continue;w===usSide(m)?v++:d++}
 const pr=pairs();const nx=L.find(m=>!winner(m)&&dobj(m.d)>=today0());
 document.getElementById('stats').innerHTML=[[pr.length,'Duplas'],[new Set(pr.map(p=>p.c)).size,'Categorias'],[L.length,'Jogos'],[v+'–'+d,'Vitórias–derrotas'],[nx?nx.d+' '+nx.t:'—','Próximo jogo']].map(([b,s])=>`<div class="stat"><b>${esc(b)}</b><span>${esc(s)}</span></div>`).join('')}
function render(){stats();document.querySelectorAll('#tabs button').forEach(b=>b.setAttribute('aria-selected',b.dataset.v===st.v));
 document.getElementById('view').innerHTML=st.v==='calendario'?vCal():st.v==='categorias'?vCats():vPairs();
 document.getElementById('foot').innerHTML=(R.updated?'Resultados actualizados a '+esc(new Date(R.updated).toLocaleString('pt-PT',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'}))+'. ':'Ainda sem resultados: o torneio começa a 28/11. ')+'Dados do <a href="https://padelteams.pt/info/matches?k=Y2lkPTc3MDUmdGlkPTA=">padelteams.pt</a>, lidos de hora a hora. Classificação calculada aqui (vitórias, diferença de sets, diferença de jogos): confirmar sempre no site da organização.'}
const cs=document.getElementById('cat');
[...new Set(S.filter(r=>isUs(r[3])||isUs(r[4])).map(r=>r[0]))].sort((a,b)=>catRank(a)-catRank(b)).forEach(c=>{const o=document.createElement('option');o.value=c;o.textContent=catLabel(c);cs.appendChild(o)});
const qi=document.getElementById('q');qi.value=st.q;cs.value=st.cat;
qi.addEventListener('input',()=>{st.q=qi.value;save();render()});
cs.addEventListener('change',()=>{st.cat=cs.value;save();render()});
const VIEWS=['calendario','categorias','duplas'];
document.getElementById('tabs').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;st.v=b.dataset.v;location.hash=st.v;render()});
document.getElementById('view').addEventListener('click',e=>{const b=e.target.closest('[data-day]');if(!b)return;st.day=b.dataset.day;render()});
const fromHash=()=>{const h=location.hash.slice(1);if(h==='hoje')st.v='calendario';else if(VIEWS.includes(h))st.v=h};
window.addEventListener('hashchange',()=>{fromHash();render()});fromHash();
build();render();
fetch(new URL('data.json',document.baseURI).href.replace('/preview/data.json','/data.json'),{cache:'no-store'}).then(r=>r.ok?r.json():null).then(j=>{if(j&&typeof j==='object'){R={results:j.results||{},extra:Array.isArray(j.extra)?j.extra:[],updated:j.updated||null};build();render()}}).catch(()=>{});
}
</script>
