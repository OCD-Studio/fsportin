<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>FSportIN · Türne Fest</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<!-- Degular (Adobe Fonts, projecto Elite). A Figtree fica como substituta se o kit não carregar. -->
<link rel="stylesheet" href="https://use.typekit.net/dgw5mps.css">
<style>
/* VOICE: o quadro de jogos da equipa FSportIN, legível a correr entre campos
   IDEA: preto de marca, branco de letra, cinzentos de apoio; amarelo só em pequenos detalhes
   PICTURE: a lista de jogos com a nossa dupla sempre primeiro, marcada pelo lobo
   COLOUR and TYPE: #000 / #fff / cinzentos + amarelo #ffd21f; Degular quando disponível, Figtree como substituta
   LAYOUT: coluna única com a mesma largura no cabeçalho, no conteúdo e no rodapé */
:root{color-scheme:dark;
--bg:#000;--card:#101010;--ink:#fff;--soft:#cfcfcf;--mut:#9a9a9a;--rule:#2a2a2a;--y:#ffd21f;--pad:max(5vw,16px)}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.5 degular,Figtree,system-ui,sans-serif;font-variant-numeric:tabular-nums;overflow-x:clip;-webkit-font-smoothing:antialiased}
.wrap{width:min(1240px,100% - 2 * var(--pad));margin-inline:auto}
h1,h2,h3{font-weight:800;letter-spacing:-.01em}
a{color:inherit}
:focus-visible{outline:3px solid var(--y);outline-offset:2px}

/* cabeçalho */
.top{border-bottom:1px solid var(--rule);padding-top:22px}
.brand-row img{height:26px;width:auto;display:block}
.hero{margin-top:30px}
.hero::before{content:"";display:block;width:44px;height:4px;background:var(--y);margin-bottom:16px}
.hero h1{font-size:clamp(42px,7vw,76px);line-height:.98;letter-spacing:-.025em;margin:0;text-wrap:balance}
.hero p{margin:12px 0 0;color:var(--mut)}
.stats{display:flex;flex-wrap:wrap;gap:12px 36px;margin-top:22px}
.stat b{display:block;font-weight:800;font-size:30px;line-height:1}
.stat span{font-size:13px;color:var(--mut)}
.tabs{display:flex;gap:4px;margin-top:22px;margin-bottom:-1px;overflow-x:auto}
.tabs button{flex:none;font:700 16px/1 degular,Figtree,sans-serif;color:var(--mut);background:none;border:0;border-bottom:3px solid transparent;padding:14px 14px;min-height:46px;cursor:pointer}
.tabs button:hover{color:var(--ink)}
.tabs button[aria-selected=true]{color:var(--ink);border-bottom-color:var(--y)}

/* conteúdo */
main{padding-block:24px 56px}
.bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:16px}
.bar input,.bar select{font:16px degular,Figtree,sans-serif;min-height:44px;padding:8px 12px;border:1px solid var(--rule);border-radius:10px;background:var(--card);color:var(--ink)}
.bar input{flex:1 1 220px}
.bar input::placeholder{color:var(--mut)}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:14px}
.chip{flex:none;font:600 15px degular,Figtree,sans-serif;min-height:40px;padding:6px 12px;border-radius:999px;border:1px solid var(--rule);background:var(--card);color:var(--ink);cursor:pointer}
.chip[aria-pressed=true]{background:var(--ink);color:#000;border-color:var(--ink)}
.chip small{opacity:.65;margin-left:4px}
.day h2{font-size:26px;margin:24px 0 10px;line-height:1.1}

/* cartão de jogo: hora e estado à esquerda, duplas ao centro, categoria à direita */
.m{display:grid;grid-template-columns:92px minmax(0,1fr) auto;gap:6px 16px;align-items:start;background:var(--card);border:1px solid var(--rule);border-radius:12px;padding:14px 16px;margin-bottom:8px}
.m.nocat{grid-template-columns:92px minmax(0,1fr)}
.when .t{font-weight:800;font-size:30px;line-height:1;white-space:nowrap}
.when .d{font-size:13px;color:var(--mut);margin:5px 0 9px}
.tm{display:flex;justify-content:space-between;gap:10px;padding:3px 0}
.tm .nm{display:flex;align-items:center;gap:8px;flex:1}
.ico{flex:none;width:22px;display:inline-flex;justify-content:center}
.ico img{width:22px;height:auto;display:block}
.tm.us{font-weight:700;font-size:18px;color:var(--ink)}
.tm:not(.us){font-weight:500;font-size:15px;color:var(--soft)}
.tm.w .txt::after{content:" ✓";color:var(--y)}
.sc{font-weight:700;font-size:18px;text-align:right;white-space:nowrap}
.meta{font-size:13px;color:var(--mut);margin-top:6px}
.pill{display:inline-block;font-weight:800;font-size:18px;line-height:1;letter-spacing:.01em;background:var(--ink);color:#000;border-radius:8px;padding:7px 10px;white-space:nowrap}
.badge{display:inline-block;font-weight:700;font-size:12px;line-height:1.3;padding:3px 8px;border-radius:6px;white-space:nowrap;border:1px solid transparent}
.b-win{background:var(--y);color:#000}
.b-loss{border-color:#555;color:var(--soft)}
.b-live{border-color:var(--y);color:var(--y)}
.b-wait{background:#1f1f1f;color:var(--mut)}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,380px),1fr));gap:14px}
.card{background:var(--card);border:1px solid var(--rule);border-radius:14px;padding:14px 16px}
.card .m{background:#000}
.card h3{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;font-size:22px;margin:0 0 8px;line-height:1.1}
.card h3 small{font:500 14px degular,Figtree,sans-serif;color:var(--mut);margin-left:auto}
.card h4{font-size:13px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--mut);margin:14px 0 0}
table{width:100%;border-collapse:collapse;font-size:14px;margin:6px 0 10px}
th,td{padding:6px 4px;border-bottom:1px solid var(--rule);text-align:right}
th:nth-child(2),td:nth-child(2){text-align:left}
th{font-weight:600;color:var(--mut);font-size:13px}
tr.us td{background:rgba(255,210,31,.10);font-weight:700}
tr.us td:first-child{box-shadow:inset 3px 0 0 var(--y)}
.path{font-size:14px;margin:4px 0 0;padding:0;list-style:none;color:var(--soft)}
.path li{padding:6px 0;border-top:1px dashed var(--rule)}
.path li b{font-weight:700;color:var(--ink)}
.empty{padding:28px;text-align:center;color:var(--mut);background:var(--card);border:1px dashed var(--rule);border-radius:14px}

/* rodapé */
.site{border-top:1px solid var(--rule);padding:40px 0 52px}
.logos{display:flex;flex-wrap:wrap;align-items:center;gap:20px 32px}
.l-fsp{height:30px;width:auto;display:block}
.l-turne{height:60px;width:auto;display:block}
.mote{font-weight:800;font-size:clamp(26px,4.4vw,44px);line-height:1.08;letter-spacing:-.02em;margin:32px 0 26px;max-width:22ch;text-wrap:balance}
.info{display:flex;flex-wrap:wrap;gap:16px 48px;margin:0}
.info dt{font-size:12px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--mut)}
.info dd{margin:2px 0 0;font-weight:700;font-size:18px}
.info a{text-decoration:underline;text-decoration-color:var(--y);text-decoration-thickness:2px;text-underline-offset:4px}
.foot{font-size:13px;color:var(--mut);margin:32px 0 0;max-width:72ch}

@media(max-width:600px){
 .m,.m.nocat{grid-template-columns:72px minmax(0,1fr)}
 .when{grid-row:1 / span 2}
 .m .cat{grid-column:2}
 .when .t{font-size:26px}
 .brand-row img{height:22px}
}
@media(prefers-reduced-motion:no-preference){.b-live{animation:p 1.6s ease-in-out infinite}@keyframes p{50%{opacity:.55}}}
</style>
</head>
<body>
<header class="top">
 <div class="wrap">
  <div class="brand-row"><img src="assets/fsportin-logo-white.svg" alt="FSportIN Padel"></div>
  <div class="hero">
   <h1>Türne Fest</h1>
   <p>FSportIN · Re-Active Türne Fest ALL IN · Winter Edition</p>
  </div>
  <div class="stats" id="stats"></div>
  <nav class="tabs" role="tablist" id="tabs">
   <button role="tab" data-v="hoje">Hoje</button>
   <button role="tab" data-v="calendario">Calendário</button>
   <button role="tab" data-v="categorias">Categorias e grupos</button>
   <button role="tab" data-v="duplas">Duplas e percurso</button>
  </nav>
 </div>
</header>
<main class="wrap">
 <div class="bar">
  <input id="q" type="search" placeholder="Filtrar por jogador (ex.: Bernardo)" aria-label="Filtrar por jogador">
  <select id="cat" aria-label="Categoria"><option value="">Todas as categorias</option></select>
 </div>
 <div id="view"></div>
</main>
<footer class="site">
 <div class="wrap">
  <div class="logos">
   <img class="l-fsp" src="assets/fsportin-logo-white.svg" alt="FSportIN Padel">
   <img class="l-turne" src="assets/turne-logo-white.png" alt="Türne">
  </div>
  <p class="mote">It's our Türne, our union is our victory</p>
  <dl class="info">
   <div><dt>Quando</dt><dd>28/11 a 08/12/2026</dd></div>
   <div><dt>Onde</dt><dd><a href="https://maps.app.goo.gl/LUm9yExQahoXvbnJ8">D'Ouro Padel</a></dd></div>
  </dl>
  <p class="foot" id="foot"></p>
 </div>

3.38","Grupo J","Pedro Moreira / Miguel Brito - FSportIN","Manuel Carvalho / Mário Vieira - ReActive Team","2","30/11","22:45"],["Vet.+45 - M","#1.1.9","Grupo L","RC Ricardo / RC Boss - FSportIN","Miguel Couceiro / Bruno Costa - Be Padel","2","02/12","19:00"],["Vet.+45 - M","#1.2.15","Grupo L","Miguel Couceiro / Bruno Costa - Be Padel","Helder Clara / Helder Couto - PadelMix","2","02/12","19:45"],["Vet.+45 - M","#1.3.34","Grupo L","Helder Clara / Helder Couto - PadelMix","RC Ricardo / RC Boss - FSportIN","2","02/12","20:30"],["Vet.+45 - M","#2.3","1/16","2º Grupo L","1º Grupo H","1","05/12","09:50"],["Vet.+45 - M","#2.4","1/16","2º Grupo J","1º Grupo M","5","05/12","17:20"],["Vet.+45 - M","#2.6","1/16","2º Grupo E","1º Grupo L","2","05/12","09:50"],["Vet.+45 - M","#2.9","1/16","2º Grupo I","1º Grupo J","10","05/12","09:00"]]</script>
<script>
{
const S=JSON.parse(document.getElementById('schedule').textContent);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const isUs=t=>/fsport/i.test(t||'');
const isPh=t=>/^(.+) \/ \1$/.test(String(t).trim());
const nm=t=>isPh(t)?'Dupla por definir':t.replace(/\s*-\s*FSportIN$/i,'');
const DAYS=['28/11','29/11','30/11','01/12','02/12','03/12','04/12','05/12','06/12','07/12','08/12'];
const WD=['dom','seg','ter','qua','qui','sex','sáb'];
/* ordem das categorias: das mais altas para as mais baixas; M, F, Mx dentro de cada nível; Kids e Vets no fim */
const CATS=['M2','M3','F3','MX3','M4','F4','MX4','M5','F5','MX5','M6','F6','MX6','M7','F7','KIDS 1','KIDS 2','Vet.+45 - M'];
const catRank=c=>{const i=CATS.indexOf(c);return i<0?99:i};
const catLabel=c=>c.replace(/^MX/,'Mx').replace(/^KIDS/,'Kids').replace(/ - M$/,' M');
const pill=c=>`<span class="pill" title="Categoria">${esc(catLabel(c))}</span>`;
const dobj=d=>{const[dd,mm]=d.split('/').map(Number);return new Date(2026,mm-1,dd)};
const dlabel=d=>{const o=dobj(d);return WD[o.getDay()]+' '+d};
const sortKey=m=>dobj(m.d).getTime()+(+m.t.slice(0,2))*60+(+m.t.slice(3));
let R={results:{},extra:[],updated:null};
let M=[];
function build(){
 const by=new Map();
 for(const r of S){const[c,n,ph,a,b,court,d,t]=r;by.set(c+'|'+n,{c,n,ph,a,b,court,d,t})}
 for(const r of (R.extra||[])){if(!Array.isArray(r)||r.length<8)continue;const[c,n,ph,a,b,court,d,t]=r.map(String);by.set(c+'|'+n,{c,n,ph,a,b,court,d,t})}
 M=[...by.values()].map(m=>{const k=m.c+'|'+m.n;const res=R.results?.[k]||null;return{...m,k,res,us:isUs(m.a)||isUs(m.b)}});
 M.sort((x,y)=>sortKey(x)-sortKey(y));
}
function sets(sc){const p=String(sc||'').match(/\d+\s*[-–]\s*\d+/g)||[];return p.map(s=>s.split(/[-–]/).map(x=>+x.trim()))}
function winner(m){if(!m.res)return 0;if(m.res.w==1||m.res.w==2)return +m.res.w;const s=sets(m.res.sc);let a=0,b=0;s.forEach(([x,y])=>x>y?a++:y>x&&b++);return a>b?1:b>a?2:0}
function status(m){const st=(m.res?.st||'').toLowerCase();if(winner(m))return'fim';if(/jog|live|curso/.test(st))return'live';return'wait'}
function badge(m){const w=winner(m),st=status(m);
 if(st==='live')return'<span class="badge b-live">A jogar</span>';
 if(w&&m.us){const usSide=isUs(m.a)?1:2;return w===usSide?'<span class="badge b-win">Vitória</span>':'<span class="badge b-loss">Derrota</span>'}
 if(w)return'<span class="badge b-wait">Terminado</span>';
 return'<span class="badge b-wait">Por jogar</span>'}
function scoreSide(m,side){const s=sets(m.res?.sc);if(!s.length)return'';return s.map(x=>side===1?x[0]:x[1]).join('  ')}
function teamRow(m,t,side,w){
 const us=isUs(t);
 return`<div class="tm${us?' us':''}${w===side?' w':''}"><span class="nm"><span class="ico">${us?'<img src="assets/lobo-white.svg" alt="" title="Equipa FSportIN">':''}</span><span class="txt">${esc(nm(t))}</span></span><span class="sc">${esc(scoreSide(m,side))}</span></div>`}
/* a nossa dupla aparece sempre em primeiro; a categoria só aparece à direita quando showCat é verdadeiro */
function card(m,showCat=true){const w=winner(m);
 const flip=!isUs(m.a)&&isUs(m.b);
 const order=flip?[[m.b,2],[m.a,1]]:[[m.a,1],[m.b,2]];
 const extra=m.res?.sc&&!sets(m.res.sc).length?' · '+esc(m.res.sc):'';
 return`<div class="m${showCat?'':' nocat'}"><div class="when"><div class="t">${esc(m.t)}</div><div class="d">${esc(dlabel(m.d))}</div>${badge(m)}</div>
 <div class="body">${order.map(([t,side])=>teamRow(m,t,side,w)).join('')}<div class="meta">${esc(m.ph)} · jogo ${esc(m.n)} · Campo DP ${esc(m.court)}${extra}</div></div>
 ${showCat?`<div class="cat">${pill(m.c)}</div>`:''}</div>`}
const st={v:'hoje',q:'',cat:'',day:null};
try{const s=JSON.parse(localStorage.getItem('fsp')||'{}');Object.assign(st,{q:s.q||'',cat:s.cat||''})}catch(e){}
function save(){try{localStorage.setItem('fsp',JSON.stringify({q:st.q,cat:st.cat}))}catch(e){}}
function filt(list){const q=st.q.trim().toLowerCase();return list.filter(m=>(!st.cat||m.c===st.cat)&&(!q||(m.a+' '+m.b).toLowerCase().includes(q)))}
function ours(){return filt(M.filter(m=>m.us))}
function todayStr(){const n=new Date();const d=String(n.getDate()).padStart(2,'0')+'/'+String(n.getMonth()+1).padStart(2,'0');return d}
function vHoje(){const L=ours();const td=todayStr();let day=DAYS.includes(td)?td:null;
 if(!day){const next=L.find(m=>dobj(m.d)>=new Date(new Date().toDateString()));day=next?next.d:DAYS[0]}
 const list=L.filter(m=>m.d===day);
 const lead=DAYS.includes(td)?(day===td?'Hoje':'')+'':'Próximo dia de jogos';
 return`<div class="day"><h2>${esc(lead?lead+' · ':'')}${esc(dlabel(day))}</h2>${list.length?list.map(m=>card(m)).join(''):'<div class="empty">Sem jogos da FSportIN neste dia'+(st.q||st.cat?' com este filtro':'')+'.</div>'}</div>`}
function vCal(){const L=ours();if(!st.day)st.day=DAYS.includes(todayStr())?todayStr():'all';
 const chips=['all',...DAYS].map(d=>{const n=d==='all'?L.length:L.filter(m=>m.d===d).length;return`<button class="chip" data-day="${d}" aria-pressed="${st.day===d}">${d==='all'?'Todos':esc(dlabel(d))}<small>${n}</small></button>`}).join('');
 const days=st.day==='all'?DAYS:[st.day];
 const body=days.map(d=>{const l=L.filter(m=>m.d===d);return l.length?`<div class="day"><h2>${esc(dlabel(d))}</h2>${l.map(m=>card(m)).join('')}</div>`:''}).join('');
 return`<div class="chips">${chips}</div>${body||'<div class="empty">Sem jogos com este filtro.</div>'}`}
function standings(c,g){const gm=M.filter(m=>m.c===c&&m.ph===g&&/^#1\./.test(m.n));const T=new Map();
 const add=t=>{if(!T.has(t))T.set(t,{t,j:0,v:0,d:0,sp:0,sc:0,gp:0,gc:0})};
 for(const m of gm){add(m.a);add(m.b);const w=winner(m);if(!w)continue;const A=T.get(m.a),B=T.get(m.b);A.j++;B.j++;if(w===1){A.v++;B.d++}else{B.v++;A.d++}
  for(const[x,y]of sets(m.res.sc)){A.gp+=x;A.gc+=y;B.gp+=y;B.gc+=x;if(x>y){A.sp++;B.sc++}else if(y>x){B.sp++;A.sc++}}}
 const arr=[...T.values()].sort((x,y)=>y.v-x.v||(y.sp-y.sc)-(x.sp-x.sc)||(y.gp-y.gc)-(x.gp-x.gc));
 return{arr,done:gm.every(m=>winner(m)),games:gm}}
function groupsOfUs(){const s=new Map();for(const m of M)if(m.us&&/^Grupo/.test(m.ph)&&/^#1\./.test(m.n)){const k=m.c+'|'+m.ph;if(!s.has(k))s.set(k,{c:m.c,g:m.ph})}
 return[...s.values()].sort((a,b)=>catRank(a.c)-catRank(b.c)||a.g.localeCompare(b.g,'pt'))}
function table(st0){return`<table><thead><tr><th>#</th><th>Dupla</th><th>J</th><th>V</th><th>Sets</th><th>Jogos</th></tr></thead><tbody>${st0.arr.map((r,i)=>`<tr class="${isUs(r.t)?'us':''}"><td>${i+1}</td><td>${esc(nm(r.t))}</td><td>${r.j}</td><td>${r.v}</td><td>${r.sp}-${r.sc}</td><td>${r.gp}-${r.gc}</td></tr>`).join('')}</tbody></table>`}
function vCats(){let G=groupsOfUs().filter(x=>!st.cat||x.c===st.cat);const q=st.q.trim().toLowerCase();
 if(q)G=G.filter(x=>M.some(m=>m.c===x.c&&m.ph===x.g&&m.us&&(m.a+' '+m.b).toLowerCase().includes(q)));
 if(!G.length)return'<div class="empty">Sem grupos com este filtro.</div>';
 return`<div class="grid">${G.map(x=>{const s=standings(x.c,x.g);return`<div class="card"><h3>${pill(x.c)}<span>${esc(x.g)}</span><small>${s.done?'fechado':'provisório'}</small></h3>${table(s)}${s.games.filter(m=>m.us).map(m=>card(m,false)).join('')}</div>`}).join('')}</div>`}
function pairs(){const P=new Map();for(const m of M)for(const t of[m.a,m.b])if(isUs(t)&&/^#1\./.test(m.n)&&/^Grupo/.test(m.ph)){const k=m.c+'|'+t;if(!P.has(k))P.set(k,{c:m.c,t,g:m.ph})}
 return[...P.values()].sort((a,b)=>catRank(a.c)-catRank(b.c)||nm(a.t).localeCompare(nm(b.t),'pt'))}
function vPairs(){const q=st.q.trim().toLowerCase();const P=pairs().filter(p=>(!st.cat||p.c===st.cat)&&(!q||p.t.toLowerCase().includes(q)));
 if(!P.length)return'<div class="empty">Nenhuma dupla com este filtro.</div>';
 return`<div class="grid">${P.map(p=>{const s=standings(p.c,p.g);const pos=s.arr.findIndex(r=>r.t===p.t)+1;const me=s.arr[pos-1];
  const gl=p.g.replace('Grupo ','');
  const later=M.filter(m=>m.c===p.c&&!/^#1\./.test(m.n));
  const named=later.filter(m=>m.a===p.t||m.b===p.t);
  const slots=later.filter(m=>new RegExp('(\\d)º Grupo '+gl+'$').test(m.a)||new RegExp('(\\d)º Grupo '+gl+'$').test(m.b)).filter(m=>!named.some(n=>n.k===m.k));
  const lines=[];
  lines.push(`<li><b>Fase de grupos</b> · ${esc(p.g)} · ${me&&me.j?pos+'.º lugar ('+(s.done?'final':'provisório')+') · '+me.v+'V '+me.d+'D':'ainda sem jogos'}</li>`);
  named.forEach(m=>{const w=winner(m);const side=m.a===p.t?1:2;lines.push(`<li><b>${esc(m.ph)}</b> · ${esc(dlabel(m.d))} ${esc(m.t)} · Campo DP ${esc(m.court)} · vs ${esc(nm(side===1?m.b:m.a))} ${w?(w===side?'· <b style="color:var(--y)">ganhou</b>':'· <b>perdeu</b>'):''}</li>`)});
  if(!named.length&&slots.length){const by={};slots.forEach(m=>{const t=(new RegExp('(\\d)º Grupo '+gl+'$').test(m.a)?m.a:m.b).match(/^(\d)/)[1];(by[t]??=[]).push(m)});
   Object.keys(by).sort().forEach(k=>{const m=by[k][0];lines.push(`<li>Se ficar <b>${k}.º</b>: ${esc(m.ph)} · ${esc(dlabel(m.d))} ${esc(m.t)} · Campo DP ${esc(m.court)}${by[k].length>1?' (+'+(by[k].length-1)+' jogos)':''}</li>`)})}
  if(!named.length&&!slots.length)lines.push('<li>Eliminatórias: aparecem aqui quando a organização sortear os lugares.</li>');
  const gms=s.games.filter(m=>m.a===p.t||m.b===p.t);
  return`<div class="card"><h3>${pill(p.c)}<span>${esc(nm(p.t))}</span></h3>${gms.map(m=>card(m,false)).join('')}<h4>Percurso</h4><ul class="path">${lines.join('')}</ul></div>`}).join('')}</div>`}
function stats(){const L=M.filter(m=>m.us);let v=0,d=0;for(const m of L){const w=winner(m);if(!w)continue;(w===(isUs(m.a)?1:2))?v++:d++}
 const pr=pairs().length;const nx=L.find(m=>!winner(m)&&dobj(m.d)>=new Date(new Date().toDateString()));
 document.getElementById('stats').innerHTML=[[pr,'duplas'],[new Set(pairs().map(p=>p.c)).size,'categorias'],[L.length,'jogos marcados'],[v+' – '+d,'vitórias – derrotas'],[nx?nx.d+' '+nx.t:'—','próximo jogo']].map(([b,s])=>`<div class="stat"><b>${esc(b)}</b><span>${esc(s)}</span></div>`).join('')}
function render(){stats();
 document.querySelectorAll('#tabs button').forEach(b=>b.setAttribute('aria-selected',b.dataset.v===st.v));
 const v=document.getElementById('view');
 v.innerHTML=st.v==='hoje'?vHoje():st.v==='calendario'?vCal():st.v==='categorias'?vCats():vPairs();
 document.getElementById('foot').innerHTML=(R.updated?'Resultados actualizados a '+esc(new Date(R.updated).toLocaleString('pt-PT',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'}))+'. ':'Ainda sem resultados: o torneio começa a 28/11. ')+'Dados do <a href="https://padelteams.pt/info/matches?k=Y2lkPTc3MDUmdGlkPTA=">padelteams.pt</a>, lidos de hora a hora. Classificação calculada aqui (vitórias, diferença de sets, diferença de jogos): confirmar sempre no site da organização.'}
const cs=document.getElementById('cat');
[...new Set(S.filter(r=>isUs(r[3])||isUs(r[4])).map(r=>r[0]))].sort((a,b)=>catRank(a)-catRank(b)).forEach(c=>{const o=document.createElement('option');o.value=c;o.textContent=catLabel(c);cs.appendChild(o)});
const qi=document.getElementById('q');qi.value=st.q;cs.value=st.cat;
qi.addEventListener('input',()=>{st.q=qi.value;save();render()});
cs.addEventListener('change',()=>{st.cat=cs.value;save();render()});
const VIEWS=['hoje','calendario','categorias','duplas'];
document.getElementById('tabs').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;st.v=b.dataset.v;location.hash=st.v;render()});
document.getElementById('view').addEventListener('click',e=>{const b=e.target.closest('[data-day]');if(!b)return;st.day=b.dataset.day;render()});
const fromHash=()=>{const h=location.hash.slice(1);if(VIEWS.includes(h))st.v=h};
window.addEventListener('hashchange',()=>{fromHash();render()});fromHash();
build();render();
fetch('data.json',{cache:'no-store'}).then(r=>r.ok?r.json():null).then(j=>{if(j&&typeof j==='object'){R={results:j.results||{},extra:Array.isArray(j.extra)?j.extra:[],updated:j.updated||null};build();render()}}).catch(()=>{});
}
</script>
